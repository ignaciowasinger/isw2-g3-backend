spring.application.name=backendprojt
server.port=8080

# Base H2 en archivo: persiste entre reinicios.
spring.datasource.url=jdbc:h2:file:./data/sabores_litoral;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# En arranques normales Hibernate actualiza el esquema sin borrar datos.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# schema.sql y data.sql solo se ejecutan con el perfil "init".
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

spring.h2.console.enabled=false

# Respuestas siempre en UTF-8 (acentos y ñ correctos en la app móvil).
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JWT (HS256). El secreto debe tener al menos 32 bytes.
# En producción definí la variable de entorno APP_JWT_SECRET con un valor propio.
app.jwt.secret=${APP_JWT_SECRET:sabores-del-litoral-clave-secreta-2026-desarrollo}
# 480 minutos = 8 horas = 28.800.000 ms.
app.jwt.expiration-minutes=480
